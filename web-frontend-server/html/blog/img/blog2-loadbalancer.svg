<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker></defs>
  <rect width="700" height="330" rx="12" fill="#eef8f0"/>
  <text x="350" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b5e20">Nginx API Gateway – Path routing &amp; Round Robin</text>
  <rect x="30" y="140" width="110" height="44" rx="22" fill="#fff" stroke="#2e7d32"/>
  <text x="85" y="167" text-anchor="middle" fill="#1b5e20">👤 Client</text>
  <line x1="140" y1="162" x2="222" y2="162" stroke="#2e7d32" stroke-width="2" marker-end="url(#a)"/>
  <rect x="225" y="105" width="150" height="114" rx="10" fill="#2e7d32"/>
  <text x="300" y="135" text-anchor="middle" fill="#fff" font-weight="bold">Nginx :80</text>
  <g fill="#e8f5e9" font-size="12" text-anchor="middle">
    <text x="300" y="160">/  → web_cluster</text><text x="300" y="178">/api/ → backend</text>
    <text x="300" y="196">/student/ → backend</text><text x="300" y="214">/auth/ → Keycloak</text>
  </g>
  <g stroke="#2e7d32" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M375 125 C430 125 430 70 478 70"/><path d="M375 140 C430 140 430 130 478 130"/>
    <path d="M375 185 C430 185 430 200 478 200"/><path d="M375 205 C430 205 430 262 478 262"/>
  </g>
  <g fill="#fff" stroke="#2e7d32">
    <rect x="480" y="48" width="190" height="44" rx="8"/><rect x="480" y="108" width="190" height="44" rx="8"/>
    <rect x="480" y="178" width="190" height="44" rx="8"/><rect x="480" y="240" width="190" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1b5e20">
    <text x="575" y="75">web-frontend-server (1)</text><text x="575" y="135">web-frontend-server2 (2)</text>
    <text x="575" y="205">application-backend :8081</text><text x="575" y="267">Keycloak :8080</text>
  </g>
  <text x="575" y="103" text-anchor="middle" font-size="11" fill="#558b2f">⟳ Round Robin: 1 → 2 → 1 → 2 …</text>
  <text x="350" y="312" text-anchor="middle" font-size="12" fill="#558b2f">Một cổng vào duy nhất · chia tải đều · tăng tính sẵn sàng (High Availability)</text>
</svg>
