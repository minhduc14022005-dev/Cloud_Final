events {
    worker_connections 1024;
}

http {
    # 1. Cấu hình Upstream Load Balancer (Round Robin) cho Web Frontend
    upstream web_cluster {
        server web-frontend-server:80;
        server web-frontend-server2:80;
    }

    server {
        listen 80;
        server_name _;

        # Trình duyệt tự xin favicon mỗi lần tải trang; trả lời tại gateway để request này
        # không chiếm lượt Round Robin (nếu không, F5 luôn rơi vào cùng một máy web)
        location = /favicon.ico {
            access_log off;
            return 204;
        }

        # Định tuyến Web tĩnh (Cân bằng tải Round Robin giữa Server 1 và Server 2)
        location / {
            proxy_pass http://web_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Định tuyến App API (strip /api/)
        location /api/ {
            proxy_pass http://application-backend-server:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Mở rộng 9: Định tuyến trực tiếp /student/ vào endpoint /student của backend
        location /student/ {
            proxy_pass http://application-backend-server:8081/student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Định tuyến Keycloak Identity Server
        location /auth/ {
            proxy_pass http://authentication-identity-server:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

